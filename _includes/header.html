<header class="header wrap">
  {% include brand.html %}
  <button class="menu-toggle" aria-expanded="false" aria-controls="navigation" hidden>Menu</button>
  <nav class="nav" id="navigation" aria-label="Main navigation">
    <a href="{{ '/talks/' | relative_url }}" {% if page.url == '/talks/' or page.layout == 'talk' %}aria-current="page"{% endif %}>What’s on</a>
    <a href="{{ '/events/' | relative_url }}" {% if page.url contains '/events/' %}aria-current="page"{% endif %}>Beyond the talks</a>
    <a href="{{ '/about/' | relative_url }}" {% if page.nav_section == 'story' %}aria-current="page"{% endif %}>Our story</a>
    <a class="mobile-join" href="{{ '/join/' | relative_url }}" {% if page.nav_section == 'join' %}aria-current="page"{% endif %}>Join us</a>
  </nav>
  <a class="button outline" href="{{ '/join/' | relative_url }}" {% if page.nav_section == 'join' %}aria-current="page"{% endif %}>Join us</a>
</header>
